<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+IE:wght@100..400&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="img/logoWEB.png" />
    <title>Iniciar sesión — LUMI Bakery</title>
  </head>

  <body>
    <div id="navbar-container"></div>

    <div class="login_container">
      <form id="form-login">
        <h2 class="subtitulos">Iniciar sesión</h2><br />

        <input id="email" type="email" placeholder="Email" required /><br />
        <input id="password" type="password" placeholder="Contraseña" required /><br /><br />

        <p id="form-error" class="form-error"></p>

        <button type="submit" class="btn-ingresar">Ingresar</button>
      </form>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
